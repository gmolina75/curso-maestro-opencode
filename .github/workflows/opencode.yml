name: OpenCode - Curso Maestro

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, edited]
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1"  # Cada lunes 9am UTC

jobs:
  opencode:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      contains(github.event.comment.body, '/opencode') ||
      contains(github.event.comment.body, '/oc')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run OpenCode Agent
        uses: anomalyco/opencode/github@latest
        with:
          model: anthropic/claude-sonnet-4-5
          agent: build
          share: true
          prompt: |
            Eres el instructor del Curso Maestro de OpenCode.
            Proporciona respuestas concisas y técnicamente precisas.
            Usa español para explicaciones y inglés para comandos/código.

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opencode-logs
          path: |
            *.log
            presentaciones/
